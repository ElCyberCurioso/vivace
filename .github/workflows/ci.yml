# Accordio · comprobaciones automáticas
#
# Hasta ahora los tests solo corrían si alguien se acordaba de lanzarlos a mano
# antes de publicar. Hay escrito de sobra —205 pruebas del worker y 121 de la
# app— como para dejarlo a la memoria de nadie.
#
# Son dos trabajos independientes a propósito: la app tarda bastante más que el
# worker, y un fallo en Kotlin no debería esconder uno en el servidor.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Para poder lanzarlo a mano desde la pestaña Actions sin tocar nada.
  workflow_dispatch:

jobs:
  worker:
    name: Worker (API y web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # La 22 es la que se usa en local. `cache: npm` necesita saber dónde
          # está el lock, que no vive en la raíz del repositorio.
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      # `npm ci` y no `npm install`: instala exactamente lo del lock y falla si
      # los dos ficheros no concuerdan, que es lo que se quiere en un CI.
      - run: npm ci

      # Sintaxis de los módulos del worker y del JS que se sirve embebido. Esto
      # es lo único que mira ese JS: al vivir dentro de literales, ninguna
      # herramienta lo comprueba por su cuenta.
      - name: Comprobaciones de sintaxis
        run: npm run check

      - name: Tests del worker
        run: npm test

  android:
    name: App Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 17 es lo que declara app/build.gradle.kts (sourceCompatibility y
          # jvmTarget). Compilar con otra distinta es pedir sorpresas.
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Solo pruebas unitarias de JVM: no hay tests instrumentados en el
      # repositorio, y levantar un emulador aquí costaría más que todo lo demás
      # junto. La compilación del release se queda fuera a propósito: necesita
      # la clave de firma, que no está (ni debe estar) en el repositorio.
      - name: Tests de la app
        run: ./gradlew test --no-daemon --stacktrace
