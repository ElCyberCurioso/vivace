name = "guitarchords-sync"
main = "src/index.js"
compatibility_date = "2024-09-23"

# R2 bucket binding. Change bucket_name to your own bucket.
# Create it first with:  wrangler r2 bucket create guitarchords
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "guitarchords"

# Base de datos de Vivace (usuarios, permisos y metadatos de partituras).
# Crear una vez con:  npx wrangler d1 create vivace
# y pegar aquí el database_id que imprime el comando.
[[d1_databases]]
binding = "DB"
database_name = "vivace"
database_id = "1830ca34-43f6-429a-812d-5156287e90f1"

# Secretos (NO se guardan aquí):
#   wrangler secret put SYNC_TOKEN    token heredado de la app actual
#   wrangler secret put AUTH_SECRET   clave para firmar las sesiones (JWT)

# Enlace del botón "Storage" del admin: el bucket en el dashboard de Cloudflare.
[vars]
STORAGE_URL = "https://dash.cloudflare.com/b87bc1a8f7e74107a115865b54ddc455/r2/default/buckets/guitarchords"
