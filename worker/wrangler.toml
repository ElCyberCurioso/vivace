# El Worker se sigue llamando "guitarchords-sync": renombrarlo aquí no renombra
# nada, crea OTRO Worker, y habría que mover a mano el dominio y retirar el
# viejo. El nombre no sale de la consola de Cloudflare.
name = "guitarchords-sync"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Registro de errores. Sin esto, un fallo en producción no deja rastro ninguno:
# `wrangler tail` solo enseña lo que pasa mientras uno está mirando, y nadie
# mira a las tres de la mañana. Con esto, los `console.error` del Worker quedan
# guardados y se pueden consultar después desde el panel de Cloudflare.
[observability]
enabled = true

# R2 bucket binding. Change bucket_name to your own bucket.
# Create it first with:  wrangler r2 bucket create guitarchords
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "guitarchords"

# Base de datos de Accordio (usuarios, permisos y metadatos de partituras).
#
# Se sigue llamando "vivace" y NO se renombra: `database_name` no es una
# etiqueta, es el nombre real de la base en Cloudflare. Cambiarlo aquí no
# renombra nada — apuntaría a una base que no existe. Renombrarla de verdad
# sería crear otra D1, volcar los datos y cortar el servicio mientras tanto,
# todo por una palabra que no ve nadie.
# Crear una vez con:  npx wrangler d1 create vivace
# y pegar aquí el database_id que imprime el comando.
[[d1_databases]]
binding = "DB"
database_name = "vivace"
database_id = "1830ca34-43f6-429a-812d-5156287e90f1"

# Secreto (NO se guarda aquí). Es OBLIGATORIO: sin él la API responde 503 y no
# emite ni acepta ninguna sesión.
#   wrangler secret put AUTH_SECRET   clave para firmar las sesiones (JWT)
#
# SYNC_TOKEN ya no se usa: las rutas de token compartido y el panel /admin se
# retiraron porque se saltaban el modelo de permisos.

# --- Dominio propio -----------------------------------------------------------
# La web y la API se sirven desde el mismo Worker, así que basta con apuntar el
# dominio a él. Con `custom_domain = true` wrangler crea en el despliegue el
# registro DNS y el certificado; el requisito es que la zona `accordio.site` ya
# esté dada de alta en la misma cuenta de Cloudflare (nameservers apuntando a
# Cloudflare y estado "Active").
#
# El subdominio *.workers.dev sigue funcionando; el canónico es el apex, y el
# Worker redirige www -> apex con un 301.
[[routes]]
pattern = "accordio.site"
custom_domain = true

[[routes]]
pattern = "www.accordio.site"
custom_domain = true
